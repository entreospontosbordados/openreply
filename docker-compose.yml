
# OpenReply - Docker Compose para Dokploy

x-app: &app
  image: openreply-app:local
  build: .
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DOCKER_DATABASE_URL:?Defina DOCKER_DATABASE_URL}
    REDIS_URL: redis://redis:6379
    AUTH_TRUST_HOST: "true"
  stop_grace_period: 30s

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const h=await r.json();process.exit(h.checks.database.status==='ok'&&h.checks.redis.status==='ok'?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  worker:
    <<: *app
    command: ["./node_modules/.bin/tsx", "worker/dm-worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.cjs"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  cron:
    <<: *app
    command: ["sh", "scripts/cron.sh"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Defina DOCKER_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      AUTH_TRUST_HOST: "true"
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openreply}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Dokploy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
